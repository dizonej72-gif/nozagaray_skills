<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Norzagaray Skills Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: url('/static/norz.jpg.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1f5f9; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .register-card { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 12px; 
            width: 380px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
        input, select { 
            width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.2); box-sizing: border-box; 
            background: rgba(30, 41, 59, 0.8); color: #f1f5f9; outline: none; font-size: 14px;
        }
        .btn { 
            width: 100%; padding: 10px; background: #0ea5e9; color: #ffffff; 
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer; 
            margin-top: 20px; transition: background 0.2s;
        }
        .btn:hover { background: #0284c7; }
        .error { color: #f87171; font-size: 12px; text-align: center; margin-bottom: 10px; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 6px; }
        .login-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .login-link a { color: #38bdf8; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>Create Account</h2>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/register" method="POST">
            
            <label>Full Name:</label>
            <input type="text" name="username" placeholder="e.g. Juan dela Cruz" required autocomplete="off">
            
            <label>Password:</label>
            <input type="password" name="password" required>
            
            <label>Account Role:</label>
            <select name="role" id="roleSelect" onchange="toggleFields()" required>
                <option value="employer">Employer / Job Seeker (Looking for work)</option>
                <option value="employee">Company / Employer (Hiring workers)</option>
            </select>

            <!-- Fields para sa Employer / Job Seeker -->
            <div id="employerFields">
                <label>Barangay:</label>
                <select name="barangay">
                    <option value="">-- Select Norzagaray Barangay --</option>
                    <option value="Bangkal">Bangkal</option>
                    <option value="Baraka">Baraka</option>
                    <option value="Bigte">Bigte</option>
                    <option value="Bitungol">Bitungol</option>
                    <option value="Friendship Village Resources (FVR)">Friendship Village Resources (FVR)</option>
                    <option value="Matictic">Matictic</option>
                    <option value="Minuyan">Minuyan</option>
                    <option value="Norzagaray Poblacion">Norzagaray Poblacion</option>
                    <option value="Partida">Partida</option>
                    <option value="Pinagtulayan">Pinagtulayan</option>
                    <option value="Poblacion">Poblacion</option>
                    <option value="San Mateo">San Mateo</option>
                    <option value="Tigbe">Tigbe</option>
                </select>

                <label>Skills:</label>
                <input type="text" name="skills" placeholder="e.g. Carpentry, Welding, Plumbing">

                <label>Phone Number:</label>
                <input type="text" name="phone" placeholder="e.g. 09123456789">
            </div>

            <!-- Fields para sa Company / Employee -->
            <div id="employeeFields" style="display: none;">
                <label>Company Name:</label>
                <input type="text" name="company" placeholder="e.g. ABC Corporation">
            </div>

            <button type="submit" class="btn">Register</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Log in here</a>
        </div>
    </div>

    <script>
        function toggleFields() {
            var role = document.getElementById("roleSelect").value;
            var empFields = document.getElementById("employerFields");
            var employeeFields = document.getElementById("employeeFields");

            if (role === "employer") {
                empFields.style.display = "block";
                employeeFields.style.display = "none";
            } else {
                empFields.style.display = "none";
                employeeFields.style.display = "block";
            }
        }
    </script>
</body>
</html>
