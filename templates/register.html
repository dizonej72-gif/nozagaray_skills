<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Norzagaray Skills Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a;
            color: #f1f5f9; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        .card { 
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            padding: 30px; border-radius: 12px; width: 450px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.15); 
        }
        input, select, textarea { 
            width: 100%; padding: 10px; margin: 6px 0 14px 0; border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.2); box-sizing: border-box; 
            background: rgba(30, 41, 59, 0.8); color: #f1f5f9; font-size: 14px;
        }
        .password-container { position: relative; width: 100%; }
        .password-container input { padding-right: 40px; margin-bottom: 6px; }
        .eye-btn {
            position: absolute; right: 12px; top: 38%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center;
            color: #94a3b8;
        }
        .eye-btn:hover { color: #f1f5f9; }
        .btn { width: 100%; padding: 12px; background: #0ea5e9; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn:hover { background: #0284c7; }
        .error { color: #ef4444; font-size: 13px; margin-bottom: 10px; text-align: center; }
        
        .gender-container { display: flex; gap: 15px; margin-bottom: 14px; }
        .gender-card {
            flex: 1; background: rgba(30, 41, 59, 0.8); border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .gender-card input { display: none; }
        .gender-card.selected { border-color: #0ea5e9; background: rgba(14, 165, 233, 0.15); }
        .skill-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #38bdf8; text-align: center; margin-top: 0;">Create Account</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
            
            <label><b>Select Gender:</b></label>
            <div class="gender-container">
                <label class="gender-card" id="cardMale" onclick="selectGender('Male')">
                    <input type="radio" name="gender" value="Male" id="radioMale" required>
                    <span style="font-size: 24px;">👨‍💼</span><br><b>Male</b>
                </label>
                <label class="gender-card" id="cardFemale" onclick="selectGender('Female')">
                    <input type="radio" name="gender" value="Female" id="radioFemale" required>
                    <span style="font-size: 24px;">👩‍💼</span><br><b>Female</b>
                </label>
            </div>

            <label><b>Account Role:</b></label>
            <select name="role" id="roleSelect" onchange="toggleRoleFields()" required>
                <option value="worker">Worker (Job Seeker)</option>
                <option value="employer">Employer / Business Owner</option>
            </select>

            <!-- Worker Specific Fields -->
            <div id="workerFields">
                <label><b>Barangay in Norzagaray:</b></label>
                <select name="barangay" id="barangaySelect" required>
                    <option value="" disabled selected>Select Barangay</option>
                    <option value="Norzagaray Proper">Poblacion</option>
                    <option value="Bigte">Bigte</option>
                    <option value="San Mateo">San Mateo</option>
                    <option value="Partida">Partida</option>
                    <option value="Matictic">Matictic</option>
                    <option value="Minuyan">Minuyan</option>
                    <option value="Bitungol">Bitungol</option>
                    <option value="Tigbe">Tigbe</option>
                    <option value="Pinagtulayan">Pinagtulayan</option>
                    <option value="Bangkal">Bangkal</option>
                    <option value="Baraka">Baraka</option>
                    <option value="Fvr">Fvr</option>
                    <option value="San Lorenzo">San Lorenzo</option>
                </select>

                <label><b>Current Address:</b></label>
                <input type="text" name="address" id="addressInput" placeholder="House #, Street Address" required>

                <label><b>Primary Skills:</b></label>
                <select name="skills" id="skillsSelect" onchange="checkOtherSkill(this)" required>
                    <option value="" disabled selected>Select Skill</option>
                    <option value="Driver">Driver</option>
                    <option value="IT">IT (Information Technology)</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Others">Others (Specify)</option>
                </select>

                <!-- Others Specify Input Field -->
                <div id="otherSkillContainer" style="display: none; margin-top: -6px; margin-bottom: 14px;">
                    <label style="font-size: 13px; color: #38bdf8;">Specify Skill:</label>
                    <input type="text" id="customSkillInput" name="custom_skill" placeholder="Type your specific skill here...">
                </div>

                <label style="font-size: 13px; color: #94a3b8;">Additional Skills (Optional):</label>
                <div id="skillInputsList">
                    <div class="skill-row">
                        <input type="text" name="other_skills[]" placeholder="Enter extra skill" style="margin: 0; flex: 1;">
                        <button type="button" onclick="addSkillField()" style="background: #0ea5e9; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">+</button>
                    </div>
                </div>
            </div>

            <!-- Employer Specific Fields -->
            <div id="employerFields" style="display: none;">
                <label><b>Company or Business Name:</b></label>
                <input type="text" id="companyInput" name="company" placeholder="Business Name">

                <label><b>Your Position in Company:</b></label>
                <input type="text" id="positionInput" name="position" placeholder="e.g., Owner, Manager, HR">

                <label><b>Upload Business Permit / Legitimacy Proof (Optional):</b></label>
                <input type="file" id="proofInput" name="proof" accept="image/*" style="background: transparent; border: none; padding: 0;">
            </div>

            <label><b>Mobile Phone Number (Eksaktong 11 digits):</b></label>
            <input type="text" id="phoneInput" name="phone" placeholder="09XXXXXXXXX" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>

            <label><b>Gmail Address (Lowercase only):</b></label>
            <input type="email" id="emailInput" name="email" placeholder="name@gmail.com" oninput="this.value = this.value.toLowerCase()" required>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 15px 0;">
            
            <label><b>Full Name:</b></label>
            <input type="text" name="full_name" placeholder="Hal. Juan Dela Cruz Jr." required>

            <label><b>Username (For Login):</b></label>
            <input type="text" name="username" placeholder="Choose a unique username" required>

            <label><b>Password (Min. 6 chars with symbol !@#$%^&*):</b></label>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Password" required oninput="checkPasswordStrength()">
                <button type="button" class="eye-btn" onclick="togglePassword('password', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <small id="pwdMatchMsg" style="color: #94a3b8; display: block; margin-top: -8px; margin-bottom: 10px; font-size: 11px;"></small>

            <label><b>Confirm Password:</b></label>
            <div class="password-container">
                <input type="password" id="confirm_password" placeholder="Confirm Password" required oninput="checkPasswordStrength()">
                <button type="button" class="eye-btn" onclick="togglePassword('confirm_password', this)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>

            <button type="submit" class="btn" style="margin-top: 10px;">Register Account</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 13px;">
            Already have an account? <a href="/login" style="color: #38bdf8; text-decoration: none;">Login here</a>
        </p>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('svg');
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = "password";
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function selectGender(gender) {
            document.getElementById('radioMale').checked = (gender === 'Male');
            document.getElementById('radioFemale').checked = (gender === 'Female');
            
            if (gender === 'Male') {
                document.getElementById('cardMale').classList.add('selected');
                document.getElementById('cardFemale').classList.remove('selected');
            } else {
                document.getElementById('cardFemale').classList.add('selected');
                document.getElementById('cardMale').classList.remove('selected');
            }
        }

        function checkOtherSkill(selectObj) {
            const container = document.getElementById('otherSkillContainer');
            const customInput = document.getElementById('customSkillInput');
            if (selectObj.value === 'Others') {
                container.style.display = 'block';
                customInput.setAttribute('required', 'true');
            } else {
                container.style.display = 'none';
                customInput.removeAttribute('required');
                customInput.value = '';
            }
        }

        function addSkillField() {
            const list = document.getElementById('skillInputsList');
            const row = document.createElement('div');
            row.className = 'skill-row';
            row.style.marginTop = '8px';
            row.innerHTML = `
                <input type="text" name="other_skills[]" placeholder="Enter extra skill" style="margin: 0; flex: 1;" required>
                <button type="button" onclick="this.parentElement.remove()" style="background: #ef4444; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">-</button>
            `;
            list.appendChild(row);
        }

        function toggleRoleFields() {
            const role = document.getElementById('roleSelect').value;
            const companyInput = document.getElementById('companyInput');
            const positionInput = document.getElementById('positionInput');
            const skillsSelect = document.getElementById('skillsSelect');
            const barangaySelect = document.getElementById('barangaySelect');
            const addressInput = document.getElementById('addressInput');
            const customSkillInput = document.getElementById('customSkillInput');

            if (role === 'employer') {
                document.getElementById('workerFields').style.display = 'none';
                document.getElementById('employerFields').style.display = 'block';
                
                if (skillsSelect) skillsSelect.removeAttribute('required');
                if (barangaySelect) barangaySelect.removeAttribute('required');
                if (addressInput) addressInput.removeAttribute('required');
                if (customSkillInput) customSkillInput.removeAttribute('required');

                companyInput.setAttribute('required', 'true');
                positionInput.setAttribute('required', 'true');
            } else {
                document.getElementById('workerFields').style.display = 'block';
                document.getElementById('employerFields').style.display = 'none';
                
                if (skillsSelect) skillsSelect.setAttribute('required', 'true');
                if (barangaySelect) barangaySelect.setAttribute('required', 'true');
                if (addressInput) addressInput.setAttribute('required', 'true');

                companyInput.removeAttribute('required');
                positionInput.removeAttribute('required');
            }
        }

        function checkPasswordStrength() {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;
            const msg = document.getElementById('pwdMatchMsg');
            
            const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(p1);
            if (p1.length > 0 && (!hasSymbol || p1.length < 6)) {
                msg.style.color = '#ef4444';
                msg.innerText = '⚠️ Must be at least 6 chars with a symbol (!@#$...)';
            } else if (p1 !== p2 && p2.length > 0) {
                msg.style.color = '#ef4444';
                msg.innerText = '⚠️ Passwords do not match';
            } else if (p1 === p2 && p1.length > 0) {
                msg.style.color = '#34d399';
                msg.innerText = '✔ Secure and matching passwords';
            } else {
                msg.innerText = '';
            }
        }

        function validateForm() {
            const phone = document.getElementById('phoneInput').value;
            if (phone.length !== 11) {
                alert('Mobile phone number must be exactly 11 digits (e.g., 09XXXXXXXXX).');
                return false;
            }

            const email = document.getElementById('emailInput').value;
            if (/[A-Z]/.test(email)) {
                alert('Gmail address must be in all lowercase letters.');
                return false;
            }

            const p1 = document.getElementById('password').value;
            const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(p1);
            if (!hasSymbol || p1.length < 6) {
                alert('Password must be at least 6 characters and include a special symbol (!@#$...).');
                return false;
            }
            return true;
        }

        toggleRoleFields();
    </script>
</body>
</html>
