<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Norzagaray Skills Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: url('/static/norz.jpg.webp') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        .card { 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
            padding: 40px; border-radius: 12px; width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.15); 
            color: #f1f5f9; text-align: center;
        }
        input { 
            width: 100%; padding: 12px; margin: 8px 0 16px 0; border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.2); box-sizing: border-box; 
            background: rgba(30, 41, 59, 0.8); color: #f1f5f9; font-size: 14px;
        }
        .btn { width: 100%; padding: 12px; background: #0ea5e9; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn:hover { background: #0284c7; }
        .error { color: #ef4444; font-size: 13px; margin-bottom: 10px; }
        .success { color: #34d399; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #38bdf8; margin-top: 0; margin-bottom: 25px;">Login Portal</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div style="text-align: left;">
                <label><b>Username</b></label>
            </div>
            <input type="text" name="username" placeholder="Enter Username" required>

            <div style="text-align: left;">
                <label><b>Password</b></label>
            </div>
            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit" class="btn" style="margin-top: 10px;">Login</button>
        </form>

        <p style="margin-top: 20px; font-size: 13px;">
            Don't have an account? <a href="/register" style="color: #38bdf8; text-decoration: none;">Register here</a>
        </p>
    </div>
</body>
</html>
